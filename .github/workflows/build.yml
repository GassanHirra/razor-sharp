name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Python syntax
        run: python3 -m py_compile razor_sharp/razor_sharp.py razor_sharp/lib/*.py razor_sharp/effects/*.py

      - name: Check version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(python3 -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('razor_sharp/razor_sharp.py').read()).group(1))")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} doesn't match __version__ $v"; exit 1; }

      - name: Build .deb
        run: ./packaging/build-deb.sh

      - name: Inspect package
        run: |
          dpkg-deb --info build/*.deb
          dpkg-deb --contents build/*.deb | head -50

      - uses: actions/upload-artifact@v4
        with:
          name: razor-sharp-deb
          path: build/*.deb

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.deb
          generate_release_notes: true
